<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="Grok Review page in its dark theme: a pull request header, a streaming review with summary, risks and file-scoped comments on the left, and a changed-files list with a diff on the right.">
  <rect width="1000" height="620" fill="#0B0C0E"/>
  <rect x="20" y="20" width="960" height="580" rx="12" fill="#050506" stroke="#1E2028"/>

  <!-- top bar -->
  <text x="48" y="49" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="1" fill="#5F636C">Grok Review</text>
  <text x="952" y="49" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#8B8F98">grokreq.com/acme/api/pull/482</text>
  <line x1="20" y1="64" x2="980" y2="64" stroke="#1E2028"/>

  <!-- PR header -->
  <text x="48" y="106" font-family="Geist, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#E8EAED">Add retry budget to ingest worker</text>
  <text x="48" y="130" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#8B8F98">acme/api · #482 · feature/retry-budget → main</text>
  <text x="952" y="106" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13"><tspan fill="#3FB950">+128</tspan><tspan fill="#8B8F98">   </tspan><tspan fill="#F85149">−34</tspan><tspan fill="#8B8F98">   ·   4 files</tspan></text>
  <line x1="20" y1="150" x2="980" y2="150" stroke="#1E2028"/>

  <!-- left: review -->
  <text x="48" y="184" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="1" fill="#5F636C">REVIEW</text>
  <rect x="116" y="170" width="96" height="20" rx="10" fill="#3FB950" fill-opacity="0.12" stroke="#3FB950" stroke-opacity="0.35"/>
  <circle cx="130" cy="180" r="3.5" fill="#3FB950"/>
  <text x="140" y="184" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#3FB950">streaming</text>
  <rect x="470" y="168" width="86" height="24" rx="6" fill="none" stroke="#2A2D37"/>
  <text x="513" y="184" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#8B8F98">Re-run</text>

  <g font-family="Geist, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="48" y="226" font-size="15" font-weight="600" fill="#E8EAED">Summary</text>
    <text x="48" y="252" font-size="14" fill="#8B8F98">Adds a bounded retry budget so a slow downstream can’t</text>
    <text x="48" y="274" font-size="14" fill="#8B8F98">starve the ingest queue. The approach is sound; two edge</text>
    <text x="48" y="296" font-size="14" fill="#8B8F98">cases still need tests before merge.</text>

    <text x="48" y="338" font-size="15" font-weight="600" fill="#E8EAED">Risks</text>
    <text x="48" y="364" font-size="14" fill="#8B8F98"><tspan fill="#5F636C">•  </tspan>Budget resets per process, so a restart reopens the window</text>
    <text x="48" y="386" font-size="14" fill="#8B8F98"><tspan fill="#5F636C">•  </tspan>backoff() can return 0 when jitter exceeds the base delay</text>

    <text x="48" y="428" font-size="15" font-weight="600" fill="#E8EAED">File-scoped comments</text>
    <text x="48" y="454" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#E8EAED">worker/retry_budget.ts</text>
    <text x="48" y="478" font-size="14" fill="#8B8F98">Clamp jitter to the base delay before sleeping, and add a</text>
    <text x="48" y="500" font-size="14" fill="#8B8F98">test for attempt = 0.<tspan fill="#E8EAED"> ▍</tspan></text>
  </g>

  <!-- right: files -->
  <text x="584" y="184" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="1" fill="#5F636C">FILES CHANGED</text>
  <g font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11">
    <rect x="584" y="199" width="64" height="18" rx="3" fill="#1E2028"/>
    <text x="616" y="212" text-anchor="middle" fill="#8B8F98">modified</text>
    <text x="660" y="212" font-size="12" fill="#E8EAED">worker/ingest.ts</text>
    <text x="952" y="212" text-anchor="end" font-size="12"><tspan fill="#3FB950">+64</tspan><tspan fill="#8B8F98"> </tspan><tspan fill="#F85149">−12</tspan></text>

    <rect x="584" y="229" width="64" height="18" rx="3" fill="#3FB950" fill-opacity="0.15"/>
    <text x="616" y="242" text-anchor="middle" fill="#3FB950">added</text>
    <text x="660" y="242" font-size="12" fill="#E8EAED">worker/retry_budget.ts</text>
    <text x="952" y="242" text-anchor="end" font-size="12" fill="#3FB950">+51</text>

    <rect x="584" y="259" width="64" height="18" rx="3" fill="#1E2028"/>
    <text x="616" y="272" text-anchor="middle" fill="#8B8F98">modified</text>
    <text x="660" y="272" font-size="12" fill="#E8EAED">worker/config.ts</text>
    <text x="952" y="272" text-anchor="end" font-size="12"><tspan fill="#3FB950">+9</tspan><tspan fill="#8B8F98"> </tspan><tspan fill="#F85149">−3</tspan></text>

    <rect x="584" y="289" width="64" height="18" rx="3" fill="#1E2028"/>
    <text x="616" y="302" text-anchor="middle" fill="#8B8F98">modified</text>
    <text x="660" y="302" font-size="12" fill="#E8EAED">tests/ingest.test.ts</text>
    <text x="952" y="302" text-anchor="end" font-size="12"><tspan fill="#3FB950">+4</tspan><tspan fill="#8B8F98"> </tspan><tspan fill="#F85149">−19</tspan></text>
  </g>

  <!-- diff -->
  <rect x="584" y="328" width="368" height="252" rx="8" fill="#0D0F12" stroke="#1E2028"/>
  <text x="600" y="352" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#8B8F98">worker/retry_budget.ts</text>
  <line x1="585" y1="366" x2="951" y2="366" stroke="#1E2028"/>
  <rect x="585" y="374" width="366" height="22" fill="#818CF8" fill-opacity="0.07"/>
  <rect x="585" y="396" width="366" height="22" fill="#2EA043" fill-opacity="0.09"/>
  <rect x="585" y="418" width="366" height="22" fill="#2EA043" fill-opacity="0.09"/>
  <rect x="585" y="462" width="366" height="22" fill="#F85149" fill-opacity="0.09"/>
  <rect x="585" y="484" width="366" height="22" fill="#2EA043" fill-opacity="0.09"/>
  <g font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12">
    <text x="600" y="390" fill="#8B8F98">@@ -0,0 +1,18 @@</text>
    <text x="600" y="412" fill="#3FB950">+ export const backoff = (n: number) =&gt;</text>
    <text x="600" y="434" fill="#3FB950">+   Math.min(2 ** n * BASE + jitter(), MAX);</text>
    <text x="600" y="456" fill="#8B8F98">  export { MAX_MS };</text>
    <text x="600" y="478" fill="#F85149">- const delay = 2 ** n * BASE;</text>
    <text x="600" y="500" fill="#3FB950">+ const budget = new RetryBudget(0.2);</text>
    <text x="600" y="522" fill="#8B8F98">  </text>
  </g>
</svg>
