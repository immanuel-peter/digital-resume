<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="AutoMoE architecture: a front camera frame feeds four perception experts, each producing a 256-dimensional feature vector. A gating network, conditioned on 64-dimensional context, keeps the top two expert weights and fuses the features. A trajectory head outputs ten waypoints and a speed.">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0.8 L9.2 5 L0 9.2 Z" fill="#5B6470"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#FFFFFF"/>

  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="2" fill="#8A93A0" text-anchor="middle">
    <text x="118" y="44">INPUT</text>
    <text x="390" y="44">EXPERTS</text>
    <text x="680" y="44">GATE</text>
    <text x="917" y="44">POLICY</text>
  </g>

  <!-- camera frame -->
  <rect x="28" y="150" width="180" height="135" rx="8" fill="#EAF0F7" stroke="#B9C4D2"/>
  <path d="M28 212 H208 V277 a8 8 0 0 1 -8 8 H36 a8 8 0 0 1 -8 -8 Z" fill="#CBD2DB"/>
  <rect x="40" y="186" width="20" height="26" fill="#B7C3D2"/>
  <rect x="64" y="172" width="16" height="40" fill="#C4CEDA"/>
  <rect x="150" y="190" width="24" height="22" fill="#B7C3D2"/>
  <rect x="178" y="176" width="18" height="36" fill="#C4CEDA"/>
  <path d="M76 285 L112 212 H124 L160 285 Z" fill="#8E98A5"/>
  <line x1="118" y1="283" x2="118" y2="214" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="118" y="307" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#5B6470">front camera · 800×600</text>

  <!-- context box -->
  <rect x="28" y="478" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#B9C4D2"/>
  <text x="118" y="500" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#14171C">context features</text>
  <text x="118" y="518" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#5B6470">64-d</text>

  <!-- camera to experts -->
  <g fill="none" stroke="#7C8794" stroke-width="1.5" marker-end="url(#ah)">
    <path d="M208 217 C250 217 250 111 290 111"/>
    <path d="M208 217 C250 217 250 201 290 201"/>
    <path d="M208 217 C250 217 250 291 290 291"/>
    <path d="M208 217 C250 217 250 381 290 381"/>
  </g>

  <!-- experts -->
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="290" y="80" width="200" height="62" rx="8" fill="#FFFFFF" stroke="#C7CFDA"/>
    <circle cx="310" cy="102" r="5" fill="#2F6FDE"/>
    <text x="324" y="107" font-size="13.5" font-weight="600" fill="#14171C">Detection</text>
    <text x="310" y="127" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">BDD100K · 10 classes</text>

    <rect x="290" y="170" width="200" height="62" rx="8" fill="#FFFFFF" stroke="#C7CFDA"/>
    <circle cx="310" cy="192" r="5" fill="#E07B00"/>
    <text x="324" y="197" font-size="13.5" font-weight="600" fill="#14171C">Segmentation</text>
    <text x="310" y="217" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">BDD100K · 19 classes</text>

    <rect x="290" y="260" width="200" height="62" rx="8" fill="#FFFFFF" stroke="#C7CFDA"/>
    <circle cx="310" cy="282" r="5" fill="#1F9D76"/>
    <text x="324" y="287" font-size="13.5" font-weight="600" fill="#14171C">Drivable area</text>
    <text x="310" y="307" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">BDD100K · 3 classes</text>

    <rect x="290" y="350" width="200" height="62" rx="8" fill="#FFFFFF" stroke="#C7CFDA"/>
    <circle cx="310" cy="372" r="5" fill="#8250DF"/>
    <text x="324" y="377" font-size="13.5" font-weight="600" fill="#14171C">nuScenes queries</text>
    <text x="310" y="397" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">196 queries · 10 classes</text>
  </g>

  <!-- experts to gate -->
  <g fill="none" stroke="#7C8794" stroke-width="1.5" marker-end="url(#ah)">
    <line x1="490" y1="111" x2="578" y2="111"/>
    <line x1="490" y1="201" x2="578" y2="201"/>
    <line x1="490" y1="291" x2="578" y2="291"/>
    <line x1="490" y1="381" x2="578" y2="381"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#8A93A0" text-anchor="middle">
    <text x="534" y="104">256-d</text>
    <text x="534" y="194">256-d</text>
    <text x="534" y="284">256-d</text>
    <text x="534" y="374">256-d</text>
  </g>

  <!-- gate -->
  <rect x="580" y="84" width="200" height="336" rx="10" fill="#F4F6F9" stroke="#8E98A5" stroke-width="1.5"/>
  <text x="680" y="112" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14171C">Gating network</text>
  <text x="680" y="132" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">softmax · top-k = 2</text>

  <line x1="600" y1="320" x2="762" y2="320" stroke="#8E98A5"/>
  <rect x="612" y="196" width="24" height="124" fill="#2F6FDE"/>
  <rect x="646" y="312" width="24" height="8" fill="none" stroke="#E07B00" stroke-dasharray="3 2"/>
  <rect x="680" y="236" width="24" height="84" fill="#1F9D76"/>
  <rect x="714" y="312" width="24" height="8" fill="none" stroke="#8250DF" stroke-dasharray="3 2"/>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#5B6470" text-anchor="middle">
    <text x="624" y="338">w1</text>
    <text x="658" y="338">w2</text>
    <text x="692" y="338">w3</text>
    <text x="726" y="338">w4</text>
  </g>
  <text x="680" y="362" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5B6470">expert weights</text>
  <text x="680" y="378" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#8A93A0">(illustrative)</text>
  <text x="680" y="406" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#14171C">fused = Σ w<tspan dy="3" font-size="8">i</tspan><tspan dy="-3"> · f</tspan><tspan dy="3" font-size="8">i</tspan></text>

  <!-- context to gate -->
  <path d="M208 503 H680 V422" fill="none" stroke="#7C8794" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- gate to policy -->
  <line x1="780" y1="252" x2="848" y2="252" stroke="#7C8794" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="814" y="244" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#8A93A0">256-d</text>

  <!-- policy -->
  <rect x="850" y="178" width="135" height="110" rx="10" fill="#FFFFFF" stroke="#8E98A5" stroke-width="1.5"/>
  <text x="917" y="208" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#14171C">Trajectory head</text>
  <text x="917" y="228" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">MLP · hidden 256</text>
  <text x="917" y="260" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#14171C">10 × (x, y) + speed</text>
  <line x1="917" y1="288" x2="917" y2="344" stroke="#7C8794" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- waypoints -->
  <path d="M868 480 Q884 392 960 368" fill="none" stroke="#C7CFDA" stroke-width="1.5"/>
  <g fill="#14171C">
    <circle cx="872" cy="461" r="4.5"/>
    <circle cx="878" cy="444" r="4.5"/>
    <circle cx="884.5" cy="428" r="4.5"/>
    <circle cx="894.5" cy="415" r="4.5"/>
    <circle cx="905" cy="402" r="4.5"/>
    <circle cx="915" cy="391" r="4.5"/>
    <circle cx="929" cy="382" r="4.5"/>
    <circle cx="943.5" cy="374" r="4.5"/>
    <circle cx="960" cy="368" r="4.5"/>
  </g>
  <circle cx="868" cy="480" r="4.5" fill="#FFFFFF" stroke="#14171C" stroke-width="1.5"/>
  <text x="917" y="508" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#5B6470">10 waypoints (x, y)</text>
  <text x="917" y="524" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#5B6470">+ speed</text>
</svg>
