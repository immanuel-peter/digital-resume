<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="Postplan dashboard listing published HTML drafts with version counts, and a terminal showing the curl command an agent uses to publish a draft.">
  <rect width="1000" height="620" fill="#EFEDE8"/>

  <!-- browser window -->
  <rect x="20" y="20" width="960" height="580" rx="12" fill="#F6F5F2" stroke="#D8D5CD"/>
  <path d="M20 64 V32 a12 12 0 0 1 12 -12 H968 a12 12 0 0 1 12 12 V64 Z" fill="#ECEAE4"/>
  <line x1="20" y1="64" x2="980" y2="64" stroke="#D8D5CD"/>
  <circle cx="44" cy="42" r="6" fill="#D5D1C7"/>
  <circle cx="64" cy="42" r="6" fill="#D5D1C7"/>
  <circle cx="84" cy="42" r="6" fill="#D5D1C7"/>
  <rect x="120" y="30" width="480" height="24" rx="12" fill="#FFFFFF" stroke="#D8D5CD"/>
  <text x="140" y="46.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#6B6B6B">postplan.domain/drafts</text>

  <!-- nav -->
  <g transform="translate(60 92) scale(0.9)">
    <g fill="none" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
      <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
    </g>
  </g>
  <g font-family="'IBM Plex Sans', 'Source Sans 3', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="88" y="109" font-size="16" font-weight="700" fill="#1A1A1A">Postplan</text>
    <text x="200" y="109" font-size="14" font-weight="700" fill="#1A1A1A">Drafts</text>
    <text x="262" y="109" font-size="14" fill="#6B6B6B">Assets</text>
    <text x="324" y="109" font-size="14" fill="#6B6B6B">Tokens</text>
    <line x1="60" y1="128" x2="940" y2="128" stroke="#E4E2DC"/>

    <text x="60" y="180" font-size="32" font-weight="700" letter-spacing="-1" fill="#1A1A1A">My drafts</text>

    <text x="60" y="226" font-size="16" font-weight="700" fill="#1A1A1A">org/repo</text>
    <text x="940" y="226" text-anchor="end" font-size="13" fill="#0B57D0">GitHub ↗</text>

    <text x="60" y="268" font-size="17" font-weight="600" fill="#0B57D0">How Transformer Attention Works</text>
    <text x="60" y="290" font-size="13" fill="#6B6B6B"><tspan fill="#0B57D0">Details</tspan>  ·  v3  ·  3 versions  ·  updated 2 hours ago</text>
    <line x1="60" y1="308" x2="940" y2="308" stroke="#E4E2DC"/>

    <text x="60" y="338" font-size="17" font-weight="600" fill="#0B57D0">KV cache hit-rate walkthrough</text>
    <text x="60" y="360" font-size="13" fill="#6B6B6B"><tspan fill="#0B57D0">Details</tspan>  ·  v1  ·  1 version  ·  updated yesterday</text>
    <line x1="60" y1="378" x2="940" y2="378" stroke="#E4E2DC"/>

    <text x="60" y="408" font-size="17" font-weight="600" fill="#0B57D0">Router latency postmortem</text>
    <text x="60" y="430" font-size="13" fill="#6B6B6B"><tspan fill="#0B57D0">Details</tspan>  ·  v2  ·  2 versions  ·  updated 3 days ago</text>
    <line x1="60" y1="448" x2="940" y2="448" stroke="#E4E2DC"/>
  </g>

  <!-- terminal -->
  <rect x="528" y="328" width="440" height="216" rx="10" fill="#000000" opacity="0.12"/>
  <rect x="520" y="318" width="440" height="216" rx="10" fill="#0F1115" stroke="#2A2D35"/>
  <path d="M520 346 V328 a10 10 0 0 1 10 -10 H950 a10 10 0 0 1 10 10 V346 Z" fill="#171A20"/>
  <circle cx="540" cy="332" r="4" fill="#3A3F49"/>
  <circle cx="556" cy="332" r="4" fill="#3A3F49"/>
  <circle cx="572" cy="332" r="4" fill="#3A3F49"/>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5">
    <text x="540" y="372"><tspan fill="#7DD3A8">$ </tspan><tspan fill="#E6E8EB">curl </tspan><tspan fill="#F2C97D">"https://postplan.domain/api/v1/drafts"</tspan><tspan fill="#9AA3AE"> \</tspan></text>
    <text x="564" y="394"><tspan fill="#8FB8FF">-H </tspan><tspan fill="#F2C97D">"Authorization: Bearer $POSTPLAN_TOKEN"</tspan><tspan fill="#9AA3AE"> \</tspan></text>
    <text x="564" y="416"><tspan fill="#8FB8FF">-F </tspan><tspan fill="#F2C97D">"html=@page.html;type=text/html"</tspan><tspan fill="#9AA3AE"> \</tspan></text>
    <text x="564" y="438"><tspan fill="#8FB8FF">-F </tspan><tspan fill="#F2C97D">"title=How Transformer Attention Works"</tspan><tspan fill="#9AA3AE"> \</tspan></text>
    <text x="564" y="460"><tspan fill="#8FB8FF">-F </tspan><tspan fill="#F2C97D">"git_commit=$(git rev-parse HEAD)"</tspan></text>
    <text x="540" y="500" fill="#7B8794"># → https://{slug}.postplan.domain</text>
  </g>
</svg>
